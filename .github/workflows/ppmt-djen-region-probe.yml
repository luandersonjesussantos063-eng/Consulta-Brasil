name: Diagnostico temporario DJEN Sao Paulo
on:
  push:
    paths:
      - '.github/workflows/ppmt-djen-region-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Testar DJEN sem CPF e conferir regiao
        shell: bash
        run: |
          set -euo pipefail
          uri="https://fermfbmhwlafwopwndoj.supabase.co/functions/v1/ppmt-djen-diagnostico?forceFunctionRegion=sa-east-1&probe=probe-46f9b72e2ce84bb4bc0b5e0fa191d830"
          curl --silent --show-error --max-time 20 --output /tmp/djen-probe.json --write-out 'HTTP Function: %{http_code}\n' "$uri"
          python3 - <<'PY'
          import json
          try:
              with open('/tmp/djen-probe.json',encoding='utf-8') as f: d=json.load(f)
          except Exception as e:
              print('Nao foi possivel ler JSON da funcao:',str(e)[:120])
              raise
          for field in ('region','upstreamStatus','responseTimeMs','contentType','success','networkError','error'):
              if field in d:print(field+':',d[field])
          PY
